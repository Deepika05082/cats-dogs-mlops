name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate Python
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Compile source
        run: python -m compileall -q src

  build-and-publish:
    name: Build and publish image
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install DVC
        run: python -m pip install --upgrade pip dvc==3.0.0 pathspec==0.11.2

      - name: Restore model from DVC
        run: |
          dvc remote add --local ci ./dvcstore
          dvc pull -r ci model.pt --force

      - name: Check model artifact
        run: |
          if [ ! -f model.pt ]; then
            echo "model.pt is missing after DVC restore."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cats-dogs-mlops" >> "$GITHUB_ENV"

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-minikube:
    name: Deploy to local Minikube
    needs: build-and-publish
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy Minikube locally with kubectl apply -f k8s.yaml"
